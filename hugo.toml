baseURL = "https://aegisfleet.github.io/shared-notebook/"
locale = "ja"
defaultContentLanguage = "ja"
title = "Shared Notebook"

[module]
  replacements = "github.com/colinwilson/lotusdocs -> lotusdocs"
  [[module.imports]]
    path = "github.com/colinwilson/lotusdocs"
    disable = false
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    disable = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # HTMLタグの使用を許可

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "lotusdocs"

[params]
  # Google Fonts
  google_fonts = [
    ["Inter", "300, 400, 600, 700"],
    ["Fira Code", "500, 700"]
  ]
  sans_serif_font = "Inter"
  mono_font = "Fira Code"

  # サイト情報
  author = "ポち"
  description = "個人ノート・ドキュメント共有サイト"

  # ソーシャル
  [params.social]
    github = "aegisfleet/shared-notebook"

  [params.docs]
    title = "Shared Notebook"
    pathName = "docs"
    themeColor = "orange"
    darkMode = true
    prism = true
    prismTheme = "lotusdocs"
    breadcrumbs = true
    descriptions = true
    backToTop = true
    navDesc = true
    sidebarIcons = true
    titleIcon = true
    repoURL = "https://github.com/aegisfleet/shared-notebook"
    repoBranch = "main"

  [params.flexsearch]
    enabled = true
    tokenize = "forward"
    maxResult = 5
