baseURL = "https://aegisfleet.github.io/shared-notebook/"
title = "Shared Notebook"
defaultContentLanguage = "ja"
hasCJKLanguage = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[menu]
  [[menu.main]]
    name = "ドキュメント"
    pageRef = "/docs"
    weight = 1

  [[menu.main]]
    name = "検索"
    weight = 2
    [menu.main.params]
      type = "search"

  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/aegisfleet/shared-notebook"
    weight = 3
    [menu.main.params]
      icon = "github"

[params]
  [params.theme]
    default = "system"
    displayToggle = true

  [params.navbar]
    displayLogo = true
    displayTitle = true
    [params.navbar.logo]
      path = "images/logo.png"

  [params.page]
    width = "normal"

  [params.imageZoom]
    enable = true

  [params.footer]
    displayCopyright = true
    displayPoweredBy = true

  [params.editURL]
    enable = true
    base = "https://github.com/aegisfleet/shared-notebook/edit/main/content"
