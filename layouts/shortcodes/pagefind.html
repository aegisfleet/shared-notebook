<link href="{{ "pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">
<script src="{{ "pagefind/pagefind-ui.js" | relURL }}"></script>
<div id="pagefind-search" class="hx:my-6"></div>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    if (typeof PagefindUI !== 'undefined') {
      new PagefindUI({
        element: "#pagefind-search",
        showSubResults: true,
        translations: {
          placeholder: "ドキュメント全文を検索...",
          clear_search: "消去",
          load_more: "さらに読み込む",
          search_label: "サイト内検索",
          filters_label: "フィルター",
          zero_results: "「[SEARCH_TERM]」に一致する結果は見つかりませんでした",
          many_results: "「[SEARCH_TERM]」の検索結果: [COUNT] 件",
          one_result: "「[SEARCH_TERM]」の検索結果: 1 件",
          searching: "検索中..."
        }
      });
    }
  });
</script>
