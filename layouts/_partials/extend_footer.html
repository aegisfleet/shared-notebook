{{- if .Params.mermaid | default (site.Params.mermaid) }}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  /**
   * 現在のサイトテーマに対応した Mermaid テーマ名を返す
   * PaperMod は localStorage の 'pref-theme' に "dark" / "light" を保存する
   */
  function getMermaidTheme() {
    const stored = localStorage.getItem('pref-theme');
    if (stored === 'dark') return 'dark';
    if (stored === 'light') return 'default';
    return globalThis.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default';
  }

  // body 末尾に配置されているため DOM は確実にロード済み
  const elements = Array.from(document.querySelectorAll('.mermaid'));

  // Mermaid がレンダリング前に innerHTML を上書きするため、先にソースを退避する
  // safeHTML で出力された内容: <br> は HTML 要素、--> はテキストのまま保持
  elements.forEach(el => {
    el.dataset.src = el.innerHTML;
  });

  let renderCount = 0;

  /**
   * 全ダイアグラムを指定テーマで再描画する
   */
  async function renderMermaid() {
    const theme = getMermaidTheme();
    mermaid.initialize({
      startOnLoad: false,
      theme: theme,
      securityLevel: 'loose',
      flowchart: { curve: 'basis' }
    });

    renderCount++;
    const currentRenderId = renderCount;

    for (let i = 0; i < elements.length; i++) {
      const el = elements[i];
      const id = `mermaid-svg-${currentRenderId}-${i}`;
      const code = el.dataset.src;

      try {
        const { svg } = await mermaid.render(id, code);
        if (currentRenderId !== renderCount) return;
        el.innerHTML = svg;
      } catch (err) {
        console.error('Mermaid render error:', err);
        if (currentRenderId !== renderCount) return;
        el.innerHTML = `<pre class="mermaid-error" style="color:red; text-align:left;">${err.message || err}</pre>`;
      }
    }
  }

  // 初回描画
  await renderMermaid();

  // PaperMod のテーマ切り替えを監視する
  // テーマ変更時は <html class="dark"> の付け外しが発生する
  let debounceTimer;
  new MutationObserver(() => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(renderMermaid, 100);
  }).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['class']
  });
</script>
{{- end }}
