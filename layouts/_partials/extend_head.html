{{- if .Params.mermaid | default (site.Params.mermaid) }}
<style>
  /* Mermaid ダイアグラムのコンテナスタイル */
  .mermaid {
    text-align: center;
    margin: 1.5rem 0;
    overflow-x: auto;
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    font-family: inherit !important;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
    background: transparent !important;
  }
  /* カスタムノードクラスの背景色を CSS 変数で補正 */
  .mermaid .payment rect,
  .mermaid .payment circle,
  .mermaid .payment polygon,
  .mermaid .payment path,
  .mermaid .earning rect,
  .mermaid .earning circle,
  .mermaid .earning polygon,
  .mermaid .earning path,
  .mermaid .consumption rect,
  .mermaid .consumption circle,
  .mermaid .consumption polygon,
  .mermaid .consumption path {
    fill: var(--entry) !important;
  }
</style>
{{- end }}
